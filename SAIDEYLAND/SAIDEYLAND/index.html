<!DOCTYPE html>
<html>

<head>
    <title>GALLOPING STALLION</title>

        #ascii {
            margin: 0 0 20px 0;

            color: white;

    </style>
</head>

<body>

    <div class="container">

        <div id="ascii-container">
            <pre id="ascii"></pre>
        </div>

        <img
            id="logo"
            src="images/blackgallop.png"
            alt="Galloping Stallion"
        >

        <p>SAIDEY</p>

    </div>

    <script>
        const frames = [];

        for (let i = 1; i <= 11; i++) {
            frames.push(`images/ascii/${i}.txt`);
        }

        let currentFrame = 0;
        const ascii = document.getElementById("ascii");

        async function showFrame() {
            try {
                const response = await fetch(frames[currentFrame]);

                if (!response.ok) {
                    throw new Error(`Failed to load ${frames[currentFrame]}`);
                }

                const text = await response.text();

                ascii.textContent = text;

                currentFrame = (currentFrame + 1) % frames.length;
            } catch (error) {
                console.error(error);
            }
        }

        showFrame();

        setInterval(showFrame, 100);
    </script>

</body>

</html>
